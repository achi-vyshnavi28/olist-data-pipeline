name: CI
on: [push, pull_request]

jobs:
  spark:
    name: Spark batch + streaming tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Unit, end to end and Structured Streaming tests (native Spark reads and writes on Linux)
        run: pytest -q --junitxml=reports/junit.xml
      - name: Annotate failing tests
        if: failure()
        run: python scripts/ci_annotate.py reports/junit.xml
      - name: Run the full batch pipeline on the sample and keep the reports
        run: python -m pipeline.run
      - uses: actions/upload-artifact@v4
        with: {name: pipeline-reports, path: lake/reports/}

  airflow:
    name: Airflow DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt apache-airflow
      - name: DAG imports and task order
        run: pytest -q tests/test_dag.py --junitxml=reports/junit_dag.xml
      - name: Annotate failing tests
        if: failure()
        run: python scripts/ci_annotate.py reports/junit_dag.xml
      - name: Execute the whole DAG once with Airflow (every task runs the real pipeline stage)
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/.airflow
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          airflow db migrate
          airflow dags test olist_batch_pipeline 2026-10-01
          python -c "import json; s=json.load(open('lake/reports/quality_gold.json')); assert s['failed_errors']==0; print('gold gate passed', s['checks'], 'checks')"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: spark
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t olist-pipeline .
      - name: Run the pipeline inside the container
        run: docker run --rm olist-pipeline
